<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Guild Wars PvP Prototype</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0b0908;
  color: #d4c8a8;
  font-family: 'Segoe UI', Georgia, serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 8px;
  user-select: none;
}
h1 { color: #c89020; font-size: 1.1em; margin-bottom: 6px; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 18px rgba(200,144,32,0.5), 0 0 4px #000; }

#class-select { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
#class-select label { font-size: 12px; color: #aaa; }
#class-select select {
  background: #1a1008; color: #d4c8a8; border: 1px solid #7a5820;
  padding: 4px 8px; font-size: 13px; cursor: pointer; border-radius: 3px;
}
#start-btn {
  background: #6a4; color: #fff; border: none;
  padding: 5px 18px; font-size: 13px; cursor: pointer; border-radius: 4px;
}
#start-btn:hover { background: #7b5; }

#game-container { display: flex; gap: 8px; }

#arena-wrap { position: relative; }
canvas#arena { border: 2px solid #8a6428; cursor: crosshair; display: block; box-shadow: 0 0 24px rgba(140,100,40,0.35), inset 0 0 12px rgba(0,0,0,0.5); }

#overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.75); font-size: 32px; font-weight: bold;
  flex-direction: column; gap: 12px;
}
#overlay-sub { font-size: 14px; color: #aaa; }
#overlay-stats { display: flex; gap: 16px; margin-top: 6px; font-size: 11px; }
.stats-group { display: flex; flex-direction: column; gap: 4px; }
.stats-title { font-size: 12px; font-weight: bold; color: #adf; text-align: center; }
.stats-table { border-collapse: collapse; }
.stats-table th, .stats-table td { padding: 2px 8px; border: 1px solid #444; text-align: right; }
.stats-table th { background: #223; color: #ccc; font-weight: normal; font-size: 10px; }
.stats-table td:first-child { text-align: left; color: #eef; }
.stats-table tr.ally-row td { color: #7cf; }
.stats-table tr.enemy-row td { color: #f88; }
.stats-table tr.ally-row td:first-child { color: #adf; }
.stats-table tr.enemy-row td:first-child { color: #faa; }
#restart-btn {
  background: #6a4; color: #fff; border: none;
  padding: 6px 20px; font-size: 14px; cursor: pointer; border-radius: 4px; margin-top: 4px;
}

#right-panel { width: 190px; display: flex; flex-direction: column; gap: 6px; }

#team-panel { background: rgba(14,9,4,0.9); border: 1px solid #6a4818; padding: 6px; border-radius: 3px; }
.section-title { font-size: 10px; color: #8a6a30; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
.party-row { margin-bottom: 7px; }
.party-name { font-size: 11px; color: #bbb; margin-bottom: 2px; }
.bar-row { display: flex; gap: 2px; flex-direction: column; }
.mini-bar { height: 7px; background: #2a2a2a; border-radius: 2px; overflow: hidden; margin-bottom: 1px; }
.mini-bar-fill { height: 100%; border-radius: 2px; transition: width 0.15s; }
.mini-conds { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 1px; }
.mini-cond { width: 7px; height: 7px; border-radius: 50%; }

#combat-log { background: rgba(14,9,4,0.9); border: 1px solid #6a4818; padding: 6px; border-radius: 3px; flex: 1; overflow: hidden; }
#log-entries { height: 200px; overflow-y: auto; font-size: 10px; line-height: 1.45; }
.log-dmg  { color: #f88; }
.log-heal { color: #8f8; }
.log-cond { color: #fa8; }
.log-hex  { color: #c8f; }
.log-sys  { color: #888; }

#bottom-ui { margin-top: 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; }

#info-row { display: flex; gap: 10px; align-items: flex-start; }

#player-bars { display: flex; flex-direction: column; gap: 3px; }
.bar-group { display: flex; flex-direction: column; gap: 1px; }
.bar-label { font-size: 9px; color: #666; }
.bar-track {
  width: 180px; height: 13px; background: #160e06;
  border: 1px solid #6a4818; border-radius: 3px; overflow: hidden; position: relative;
}
.bar-fill { height: 100%; transition: width 0.1s; border-radius: 2px; }
.bar-val {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: #fff;
}
#hp-fill      { background: linear-gradient(90deg, #3a9820, #5ac82a); }
#energy-fill  { background: linear-gradient(90deg, #2450a0, #3870d0); }
#cast-fill    { background: linear-gradient(90deg, #c07018, #f09830); }
#cast-group   { display: none; }

#player-conds { display: flex; gap: 3px; flex-wrap: wrap; max-width: 180px; }
.cond-badge {
  padding: 1px 5px; border-radius: 3px; font-size: 9px;
  color: #fff; white-space: nowrap;
}

#target-box {
  width: 185px; background: rgba(14,9,4,0.9); border: 1px solid #6a4818;
  padding: 6px; border-radius: 3px;
}
#target-name { font-size: 12px; color: #fc0; margin-bottom: 3px; }
#target-hp-track { width: 100%; height: 10px; background: #2a2a2a; border-radius: 2px; overflow: hidden; margin-bottom: 2px; }
#target-hp-fill { height: 100%; background: #e44; transition: width 0.15s; }
#target-conds { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }

#skillbar { display: flex; gap: 3px; padding: 6px 8px; background: rgba(14,9,4,0.92); border: 1px solid #7a5820; border-radius: 5px; box-shadow: 0 2px 12px rgba(0,0,0,0.6); }
.skill-slot {
  width: 56px; height: 56px; background: #160e06;
  border: 2px solid #6a4818; border-radius: 4px;
  cursor: pointer; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; transition: border-color 0.1s;
  box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
}
.skill-slot:hover { border-color: #b08040; }
.skill-slot.active { border-color: #fc0; box-shadow: 0 0 8px #fc09, inset 0 0 4px rgba(255,200,0,0.1); }
.skill-slot.no-energy { border-color: #44b; }
.skill-icon { font-size: 18px; line-height: 1; }
.skill-name-txt { font-size: 6.5px; color: #aaa; text-align: center; padding: 0 2px; line-height: 1.2; margin-top: 2px; max-width: 52px; }
.skill-cost-txt { position: absolute; bottom: 2px; left: 3px; font-size: 9px; color: #88f; }
.skill-key-txt  { position: absolute; top: 2px; left: 3px; font-size: 9px; color: #666; }
.skill-cd-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.72); display: none;
  align-items: center; justify-content: center;
  font-size: 13px; color: #fc0; font-weight: bold;
}
.skill-slot.on-cd .skill-cd-overlay { display: flex; }
.skill-toggle-active { border-color: #f80 !important; background: #2a1800 !important; }

#hint { font-size: 9px; color: #6a5a38; text-align: center; }

#skill-tooltip {
  display: none; position: fixed; z-index: 200;
  background: rgba(12,8,3,0.97); border: 1px solid #8a6020;
  border-radius: 5px; padding: 8px 11px; max-width: 230px;
  pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 8px rgba(140,96,32,0.2);
}
#tt-name { color: #e8b030; font-size: 12px; font-weight: bold; margin-bottom: 2px; }
#tt-tags { color: #b0906a; font-size: 9px; margin-bottom: 5px; letter-spacing: 0.5px; }
#tt-desc { color: #ccc4a8; font-size: 10px; line-height: 1.45; margin-bottom: 6px; }
#tt-stats { color: #9090f0; font-size: 9px; border-top: 1px solid #4a3010; padding-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.tt-stat { display: flex; flex-direction: column; align-items: center; }
.tt-stat-val { font-size: 11px; color: #ddf; font-weight: bold; }
.tt-stat-lbl { font-size: 8px; color: #666; }
</style>
</head>

// ── HELPERS ──────────────────────────────────────────────────────
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }
function rndInt(lo, hi) { return Math.floor(rnd(lo, hi + 1)); }

function isEnemy(a, b) { return a.team !== b.team; }
function isAlly(a, b)  { return a.team === b.team && a !== b; }

function hasCond(c, name)  { return !!c.conditions[name]; }
function hasEnch(c, name)  { return !!c.enchantments[name]; }
function hasHex(c, name)   { return !!c.hexes[name]; }

function getTeam(game, team)   { return game.chars.filter(c => c.team === team && c.alive); }
function getEnemies(c, game)   { return getTeam(game, c.team === TEAM_ALLY ? TEAM_ENEMY : TEAM_ALLY); }
function getAllies(c, game)     { return game.chars.filter(x => x.team === c.team && x !== c && x.alive); }

function addCond(target, name, duration, game) {
  if (!target.alive) return;
  const prev = target.conditions[name];
  target.conditions[name] = { duration: prev ? Math.max(prev.duration, duration) : duration };
  const lbl = COND[name]?.label || name;
  if (!prev) game.log(`${target.name} → ${lbl}`, 'log-cond');
}

function addEnch(target, name, duration, game) {
  if (!target.alive) return;
  target.enchantments[name] = { duration };
  game.log(`${target.name} ← ${ENCH[name]?.label || name}`, 'log-heal');
}

function removeEnch(target, name, game) {
  delete target.enchantments[name];
}

function addHex(target, name, duration, game) {
  if (!target.alive) return;
  target.hexes[name] = { duration, data: HEX[name] };
  game.log(`${target.name} ← maléfice: ${HEX[name]?.label || name}`, 'log-hex');
}

// damage formula: armor reduction (GW1-like)
// Higher armor = lower multiplier = less damage taken
function calcPhysDmg(attacker, target, lo, hi) {
  const raw = rnd(lo, hi);
  const armor = Math.max(0, target.armor - (attacker.armorPen || 0));
  return Math.max(1, Math.round(raw * Math.pow(0.5, (armor - 60) / 40)));
}

function calcSpellDmg(attacker, target, lo, hi) {
  const raw = rnd(lo, hi) + (attacker.spellBonus || 0);
  // Spells use target's armor but only 20% of bonus above 60 applies
  const effectiveArmor = 60 + (target.armor - 60) * 0.2;
  return Math.max(1, Math.round(raw * Math.pow(0.5, (effectiveArmor - 60) / 40)));
}

function addFloat(g, x, y, text, color, size) {
  g.floatingTexts.push({ x: x + (Math.random()-0.5)*18, y, text, color,
    size: size || 13, vy: -58, alpha: 1, duration: 1.4, timer: 0 });
}

function dealDmg(attacker, target, dmg, type, game) {
  if (!target.alive) return;

  // Protective Spirit: cap single hit at 10% maxHp
  if (hasEnch(target, 'protective_spirit')) {
    dmg = Math.min(dmg, Math.floor(target.maxHp * 0.10));
  }
  // Guardian: 50% block for physical
  if (type === 'physique' && hasEnch(target, 'guardian') && Math.random() < 0.5) {
    game.log(`${target.name} bloque l'attaque !`, 'log-sys');
    return;
  }
  // Frenzy: double damage received
  if (hasEnch(target, 'frenzy')) dmg = Math.floor(dmg * 2);

  // Shelter spirit: reduce damage by 25% if target is near a friendly shelter zone
  if (game.aoeZones) {
    for (const z of game.aoeZones) {
      if (z.isShelter && z.caster && z.caster.team === target.team && dist(z, target) < z.radius) {
        dmg = Math.floor(dmg * 0.75);
        break;
      }
    }
  }

  // Moral: bonus attaquant
  if (game.flagStand) {
    const m = game.flagStand.morale[attacker.team];
    if (m > 0) dmg = Math.round(dmg * (1 + m * 0.01));
  }

  // Divine Intervention: absorb lethal hit
  if (target.hp - dmg <= 0 && hasEnch(target, 'divine_intervention')) {
    delete target.enchantments['divine_intervention'];
    target.hp = 1;
    game.log(`${target.name} survit grâce à Intervention Divine !`, 'log-heal');
    spawnFx(game, target.x, target.y, '#ff8', 70, 0.8);
    addFloat(game, target.x, target.y - target.radius, 'BLOQUÉ', '#ff8', 11);
    return;
  }

  target.hp -= dmg;
  if (attacker.stats) attacker.stats.dmgDealt  += dmg;
  if (target.stats)   target.stats.dmgReceived += dmg;
  // Chiffre flottant dégâts
  const isCrit = dmg > 45;
  addFloat(game, target.x, target.y - target.radius,
    `-${dmg}`, isCrit ? '#ff4' : (target.team === TEAM_ALLY ? '#f88' : '#faa'),
    isCrit ? 16 : 13);
  game.log(`${target.name} -${dmg} (${type})`, 'log-dmg');
  spawnFx(game, target.x, target.y, '#f44', 25, 0.3);

  if (target.hp <= 0) killChar(target, game, null, attacker);
}

const REZ_TIME = 15; // secondes avant réapparition au shrine

function killChar(c, g, msg, killer) {
  if (!c.alive) return;
  c.alive = false; c.hp = 0;
  c.conditions = {}; c.enchantments = {}; c.hexes = {}; c.casting = null;
  c.rezTimer = REZ_TIME;
  g.deathCount[c.team] = (g.deathCount[c.team] || 0) + 1;
  if (c.stats) c.stats.deaths++;
  if (killer && killer.stats) killer.stats.kills++;
  g.log(msg || `☠ ${c.name} est mort !`, 'log-sys');
  spawnFx(g, c.x, c.y, '#f008', 80, 1.0);
  addFloat(g, c.x, c.y - c.radius - 10, '☠', '#888', 18);
}

function respawnChar(c, g) {
  c.alive = true;
  c.hp = c.maxHp; c.energy = Math.floor(c.maxEnergy * 0.5);
  c.conditions = {}; c.enchantments = {}; c.hexes = {};
  c.x = c.spawnX + rnd(-30, 30); c.y = c.spawnY + rnd(-30, 30);
  c.rezTimer = 0; c.casting = null; c.castTimer = 0;
  c.target = null; c.autoAttack = false; c.attackTimer = 0;
  g.log(`✦ ${c.name} réapparaît au shrine !`, 'log-heal');
  spawnFx(g, c.x, c.y, '#0ff', 80, 1.0);
  addFloat(g, c.x, c.y, 'RESPAWN', '#0ff', 14);
}

function spawnFx(game, x, y, color, radius, duration) {
  game.effects.push({ x, y, color, radius, maxR: radius, duration, timer: 0 });
}

function spawnProjectile(game, src, tx, ty, color, speed, onArrive) {
  game.projectiles.push({ x: src.x, y: src.y, tx, ty, color, speed, onArrive, done: false });
}

// ── CREATION DE PERSONNAGE ──────────────────────────────────────
function makeChar(build, team, x, y, isPlayer) {
  return {
    ...build,
    team, x, y, isPlayer: !!isPlayer,
    spawnX: x, spawnY: y,
    hp: build.maxHp, energy: build.maxEnergy,
    conditions: {}, enchantments: {}, hexes: {},
    alive: true, isMoving: false,
    moveTarget: null, target: null,
    autoAttack: false, attackTimer: 0,
    casting: null, castTimer: 0,
    skillCooldowns: new Array(8).fill(0),
    usedOneUse: new Array(8).fill(false),
    aiTimer: 0, rezTimer: 0,
    velocity: 0,
    stats: { dmgDealt: 0, dmgReceived: 0, healsGiven: 0, kills: 0, deaths: 0 },
  };
}

// ── ÉTAT DU JEU ──────────────────────────────────────────────────
const game = {
  chars: [], player: null,
  effects: [], projectiles: [], aoeZones: [],
  floatingTexts: [],
  map: null, flagStand: null,
  running: false, over: false,
  deathCount: { 0: 0, 1: 0 },
  logLines: [],
  log(msg, cls = 'log-sys') {
    this.logLines.push({ msg, cls });
    if (this.logLines.length > 80) this.logLines.shift();
    const el = document.getElementById('log-entries');
    if (el) {
      const d = document.createElement('div');
      d.className = 'log-entry ' + cls;
      d.textContent = msg;
      el.appendChild(d);
      while (el.children.length > 60) el.removeChild(el.firstChild);
      el.scrollTop = el.scrollHeight;
    }
  }
};

// ── INPUT ─────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!game.running || !game.player) return;
  const p = game.player;
  // skills 1-8
  const idx = ['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8'].indexOf(e.code);
  if (idx >= 0) { e.preventDefault(); useSkill(p, idx); return; }
  // Tab: cycle targets
  if (e.code === 'Tab') { e.preventDefault(); cycleTarget(p); return; }
  // Space: toggle auto-attack
  if (e.code === 'Space') { e.preventDefault(); p.autoAttack = !p.autoAttack; return; }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

document.getElementById('arena').addEventListener('click', e => {
  if (!game.running) return;
  const rect = e.target.getBoundingClientRect();
  const mx = e.clientX - rect.left + CAM.x;
  const my = e.clientY - rect.top  + CAM.y;
  let hit = null, best = 999;
  for (const c of game.chars) {
    if (!c.alive) continue;
    const d = Math.hypot(c.x - mx, c.y - my);
    if (d < c.radius + 8 && d < best) { best = d; hit = c; }
  }
  if (hit) {
    game.player.target = hit;
    if (isEnemy(game.player, hit)) game.player.autoAttack = true;
  } else {
    game.player.moveTarget = { x: mx, y: my };
  }
});

function cycleTarget(p) {
  const enemies = getEnemies(p, game);
  if (!enemies.length) return;
  const cur = enemies.indexOf(p.target);
  p.target = enemies[(cur + 1) % enemies.length];
}

// ── USE SKILL ────────────────────────────────────────────────────
function useSkill(char, idx) {
  if (!char.alive) return;
  if (hasCond(char, 'knockdown')) return;
  const skId = char.skills[idx];
  if (!skId) return;
  const sk = SK[skId] || (skId === 'w_ressig' ? SK.w_ressig : null) || (skId === 'w_healsig' ? SK.w_healsig : null);
  if (!sk) return;
  if (char.skillCooldowns[idx] > 0) return;
  if (sk.oneUse && char.usedOneUse[idx]) return;
  if (char.energy < sk.cost) return;
  if (char.casting) return; // already casting

  if (sk.cast > 0) {
    char.casting = { skId, idx, sk, target: char.target };
    char.castTimer = 0;
  } else {
    char.energy -= sk.cost;
    sk.use(char, char.target, game);
    startCooldown(char, idx, sk);
    if (sk.oneUse) char.usedOneUse[idx] = true;
  }
}

function startCooldown(char, idx, sk) {
  char.skillCooldowns[idx] = sk.recharge || 0;
}

function finishCast(char) {
  const { skId, idx, sk, target } = char.casting;
  char.casting = null; char.castTimer = 0;
  char.energy -= sk.cost;
  sk.use(char, target, game);
  startCooldown(char, idx, sk);
  if (sk.oneUse) char.usedOneUse[idx] = true;
}

// ── MOVE ─────────────────────────────────────────────────────────
function moveChar(c, dt) {
  if (!c.alive) return;
  if (hasCond(c, 'knockdown')) { c.isMoving = false; return; }

  // compute effective speed
  let spd = c.speed;
  if (hasCond(c, 'crippled')) spd *= 0.5;
  if (hasEnch(c, 'sprint'))   spd *= 1.33;
  if (hasCond(c, 'frenzy'))   {} // frenzy doesn't slow
  if (hasHex(c, 'imagined_haste')) spd *= (HEX.imagined_haste.speedMult || 0.5);

  let dx = 0, dy = 0;
  if (c.isPlayer) {
    const up    = keys['KeyW'] || keys['ArrowUp']    || keys['KeyZ'];
    const down  = keys['KeyS'] || keys['ArrowDown'];
    const left  = keys['KeyA'] || keys['ArrowLeft']  || keys['KeyQ'];
    const right = keys['KeyD'] || keys['ArrowRight'];
    if (up)    dy -= 1;
    if (down)  dy += 1;
    if (left)  dx -= 1;
    if (right) dx += 1;
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      c.isMoving = true;
      c.moveTarget = null;
    } else if (c.moveTarget) {
      const mdx = c.moveTarget.x - c.x, mdy = c.moveTarget.y - c.y;
      const d = Math.hypot(mdx, mdy);
      if (d < 4) { c.moveTarget = null; c.isMoving = false; }
      else { dx = mdx / d; dy = mdy / d; c.isMoving = true; }
    } else {
      c.isMoving = false;
    }
  } else if (c.moveTarget) {
    const mdx = c.moveTarget.x - c.x, mdy = c.moveTarget.y - c.y;
    const d = Math.hypot(mdx, mdy);
    if (d < 4) { c.moveTarget = null; c.isMoving = false; }
    else {
      const dir = steerDir(c, mdx / d, mdy / d);
      dx = dir.dx; dy = dir.dy; c.isMoving = true;
    }
  } else {
    c.isMoving = false;
  }

  c.x = clamp(c.x + dx * spd * dt, c.radius, WORLD_W - c.radius);
  c.y = clamp(c.y + dy * spd * dt, c.radius, WORLD_H - c.radius);
  resolveWallCollision(c);
}

// Oriente le déplacement pour éviter les murs
function steerDir(c, dx, dy) {
  if (!game.map || !game.map.walls.length) return { dx, dy };
  const probe = c.radius * 2.5;
  const steps = [0, 25, -25, 50, -50, 80, -80, 110, -110, 150, -150];
  for (const deg of steps) {
    const rad = deg * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    const ndx = dx * cos - dy * sin;
    const ndy = dx * sin + dy * cos;
    const px = c.x + ndx * probe;
    const py = c.y + ndy * probe;
    let blocked = false;
    for (const w of game.map.walls) {
      if (px + c.radius > w.x && px - c.radius < w.x + w.w &&
          py + c.radius > w.y && py - c.radius < w.y + w.h) {
        blocked = true; break;
      }
    }
    if (!blocked) return { dx: ndx, dy: ndy };
  }
  return { dx, dy };
}

function resolveWallCollision(c) {
  if (!game.map) return;
  for (const w of game.map.walls) {
    if (c.x + c.radius > w.x && c.x - c.radius < w.x + w.w &&
        c.y + c.radius > w.y && c.y - c.radius < w.y + w.h) {
      const ol = (c.x + c.radius) - w.x;
      const or_ = (w.x + w.w) - (c.x - c.radius);
      const ot = (c.y + c.radius) - w.y;
      const ob = (w.y + w.h) - (c.y - c.radius);
      const mn = Math.min(ol, or_, ot, ob);
      if      (mn === ol)  c.x = w.x - c.radius;
      else if (mn === or_) c.x = w.x + w.w + c.radius;
      else if (mn === ot)  c.y = w.y - c.radius;
      else                 c.y = w.y + w.h + c.radius;
    }
  }
}

// ── AI ────────────────────────────────────────────────────────────
function aiUpdate(c, dt, g) {
  if (!c.alive || c.isPlayer) return;
  c.aiTimer -= dt;
  if (c.aiTimer > 0) return;
  c.aiTimer = 0.3 + Math.random() * 0.3;

  const allies  = getAllies(c, g).filter(x => x.alive);
  const enemies = getEnemies(c, g);
  if (!enemies.length) return;

  // ── Flagger AI : va capturer le Flag Stand ──
  if (c.isFlagger && g.flagStand) {
    const fs = g.flagStand;
    const atFlag = dist(c, fs) < fs.radius;
    const nearFoes = enemies.filter(e => dist(c, e) < 220);

    // Si le flag n'est pas à nous et qu'on n'est pas encore dessus, on y court
    if (fs.team !== c.team && !atFlag) {
      c.moveTarget = { x: fs.x + rnd(-15,15), y: fs.y + rnd(-15,15) };
      // Combat de route si ennemi très proche
      if (nearFoes.length) {
        c.target = nearFoes[0]; c.autoAttack = true;
      }
      return;
    }
    // On est sur le flag (ou il nous appartient) : se comporter normalement
    // mais rester dans la zone si le flag est contesté
    if (atFlag && fs.team === c.team) {
      const nearFoes2 = enemies.filter(e => dist(c, e) < fs.radius + 80);
      if (nearFoes2.length) {
        c.target = nearFoes2.reduce((b,e) => e.hp < b.hp ? e : b, nearFoes2[0]);
        c.autoAttack = true;
        return;
      }
    }
    // Flag capturé et zone calme → IA normale (continue ci-dessous)
  }

  // ── Monk AI ──
  if (c.skills.includes('mo_woh') || c.skills.includes('mo_heal')) {
    // Find most wounded ally (including self)
    const team = [c, ...allies];
    team.sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp));
    const wounded = team.find(x => x.hp / x.maxHp < 0.85);

    if (wounded) {
      c.target = wounded;
      // Stay near wounded ally
      c.moveTarget = { x: clamp(wounded.x + rnd(-60,60), 30, WORLD_W-30), y: clamp(wounded.y + rnd(-60,60), 30, WORLD_H-30) };

      // Choose heal skill
      if (wounded.hp / wounded.maxHp < 0.5) {
        tryAiSkill(c, 'mo_woh', g);
      } else if (wounded.hp / wounded.maxHp < 0.75) {
        if (!tryAiSkill(c, 'mo_heal', g)) tryAiSkill(c, 'mo_orison', g);
      }
      // Emergency: divine intervention
      if (wounded.hp / wounded.maxHp < 0.25) tryAiSkill(c, 'mo_divine', g);
      // Remove conditions
      if (Object.keys(wounded.conditions).length > 0) tryAiSkill(c, 'mo_removecond', g);
      // Protective spirit on low HP
      if (wounded.hp / wounded.maxHp < 0.4) tryAiSkill(c, 'mo_protspirit', g);
      return;
    }
    // Idle: team healthy — cast protective buffs proactively, attack nearby enemies
    const lowestRatio = team.reduce((a, b) => (a.hp / a.maxHp < b.hp / b.maxHp ? a : b));
    c.target = lowestRatio;
    // Try proactive protection on the most vulnerable ally
    tryAiSkill(c, 'mo_guardian', g) || tryAiSkill(c, 'mo_protspirit', g) || tryAiSkill(c, 'mo_spiritbond', g);
    // Light attack pressure on close enemies
    const closeEnemy = enemies.find(e => dist(c, e) < c.attackRange + 40);
    if (closeEnemy) { c.target = closeEnemy; c.autoAttack = true; }
    else { c.autoAttack = false; }
    // Stay within 200px of closest ally
    const anchor = allies[0] || c;
    if (dist(c, anchor) > 200) c.moveTarget = { x: anchor.x, y: anchor.y };
    return;
  }

  // ── Elementalist / Necromancer AI ──
  if (c.skills.some(s => s.startsWith('e_') || s.startsWith('me_'))) {
    // Pick weakest enemy
    let tgt = enemies.reduce((best, e) => e.hp < best.hp ? e : best, enemies[0]);
    c.target = tgt;
    // Keep distance
    const d = dist(c, tgt);
    if (d < 250) {
      const angle = Math.atan2(c.y - tgt.y, c.x - tgt.x);
      c.moveTarget = { x: clamp(tgt.x + Math.cos(angle) * 320, 30, WORLD_W-30), y: clamp(tgt.y + Math.sin(angle) * 320, 30, WORLD_H-30) };
    } else if (d > 420) {
      c.moveTarget = { x: clamp(tgt.x + rnd(-60,60), 30, WORLD_W-30), y: clamp(tgt.y + rnd(-60,60), 30, WORLD_H-30) };
    }
    // Use skills in priority order
    const spellSkills = c.skills.filter(s => s.startsWith('e_') || s.startsWith('me_') || s.startsWith('n_'));
    for (const sk of spellSkills) {
      if (tryAiSkill(c, sk, g)) break;
    }
    return;
  }

  // ── Warrior / Ranger AI ──
  let tgt = enemies.reduce((best, e) => e.hp < best.hp ? e : best, enemies[0]);
  // prefer the player
  const playerEnemy = enemies.find(e => e.isPlayer);
  if (playerEnemy && playerEnemy.hp / playerEnemy.maxHp > 0.2) tgt = playerEnemy;
  c.target = tgt;

  const d = dist(c, tgt);
  const ar = c.attackRange + 20;
  if (d > ar) {
    c.moveTarget = { x: tgt.x + rnd(-20,20), y: tgt.y + rnd(-20,20) };
  } else {
    c.moveTarget = null;
  }

  // self-heal if wounded
  if (c.hp / c.maxHp < 0.35 && tryAiSkill(c, 'w_healsig', g)) return;
  // sprint to close gap
  if (d > 250 && !hasEnch(c,'sprint')) tryAiSkill(c, 'w_sprint', g);
  // pressure skills
  if (d <= ar + 30) {
    tryAiSkill(c, 'w_eviscerate', g) ||
    tryAiSkill(c, 'w_gash', g) ||
    tryAiSkill(c, 'w_shock', g) ||
    tryAiSkill(c, 'w_bullsstrike', g) ||
    tryAiSkill(c, 'w_cyclone', g);
  }
  // auto attack
  c.autoAttack = d <= ar + 30;
}

function tryAiSkill(c, skId, g) {
  const idx = c.skills.indexOf(skId);
  if (idx < 0) return false;
  const sk = SK[skId];
  if (!sk) return false;
  if (c.skillCooldowns[idx] > 0) return false;
  if (sk.oneUse && c.usedOneUse[idx]) return false;
  if (c.energy < sk.cost) return false;
  if (c.casting) return false;
  if (hasCond(c, 'knockdown')) return false;

  if (sk.cast > 0) {
    c.casting = { skId, idx, sk, target: c.target };
    c.castTimer = 0;
  } else {
    c.energy -= sk.cost;
    sk.use(c, c.target, g);
    startCooldown(c, idx, sk);
    if (sk.oneUse) c.usedOneUse[idx] = true;
  }
  return true;
}

// ── UPDATE ────────────────────────────────────────────────────────
function update(dt) {
  if (!game.running) return;

  // Snapshot HP pour détecter les soins (floats verts)
  const hpSnap = {};
  for (const c of game.chars) if (c.alive) hpSnap[c.name] = c.hp;

  for (const c of game.chars) {
    if (!c.alive) continue;

    // Conditions tick
    for (const [name, data] of Object.entries(c.conditions)) {
      data.duration -= dt;
      const def = COND[name];
      if (def && def.dps) {
        data.dmgAccum = (data.dmgAccum || 0) + def.dps * dt;
        if (data.dmgAccum >= 1) {
          const dmg = Math.floor(data.dmgAccum);
          data.dmgAccum -= dmg;
          c.hp = Math.max(0, c.hp - dmg);
          if (c.hp <= 0) killChar(c, game, `☠ ${c.name} succombe à ses blessures !`);
        }
      }
      if (data.duration <= 0) delete c.conditions[name];
    }
    if (!c.alive) continue;

    // Hex tick
    for (const [name, data] of Object.entries(c.hexes)) {
      data.duration -= dt;
      const def = data.data || HEX[name];
      if (def && def.dps) {
        data.dmgAccum = (data.dmgAccum || 0) + def.dps * dt;
        if (data.dmgAccum >= 1) {
          const d = Math.floor(data.dmgAccum); data.dmgAccum -= d;
          c.hp = Math.max(0, c.hp - d);
          if (c.hp <= 0) killChar(c, game, `☠ ${c.name} succombe à un maléfice !`);
        }
      }
      if (def && def.energyDrain) {
        c.energy = Math.max(0, c.energy - def.energyDrain * dt);
      }
      if (data.duration <= 0) delete c.hexes[name];
    }
    if (!c.alive) continue;

    // Enchantment tick
    for (const [name, data] of Object.entries(c.enchantments)) {
      if (data.duration < 9000) { // not permanent
        data.duration -= dt;
        if (data.duration <= 0) delete c.enchantments[name];
      }
    }

    // Energy regen
    c.energy = Math.min(c.maxEnergy, c.energy + c.energyRegen * dt);

    // Cooldown tick
    for (let i = 0; i < c.skillCooldowns.length; i++) {
      if (c.skillCooldowns[i] > 0) c.skillCooldowns[i] = Math.max(0, c.skillCooldowns[i] - dt);
    }

    // Auto-retarget: if current target died, switch to next alive enemy automatically
    if (c.target && !c.target.alive) {
      const next = getEnemies(c, game).find(e => e.alive);
      c.target = next || null;
    }

    // Casting
    if (c.casting) {
      c.castTimer += dt;
      if (hasCond(c, 'knockdown')) { c.casting = null; c.castTimer = 0; }
      else if (c.castTimer >= c.casting.sk.cast) finishCast(c);
    }

    // Auto-attack tick
    if (c.autoAttack && !c.casting) {
      let atkSpd = c.attackSpeed;
      if (hasEnch(c, 'frenzy')) atkSpd *= 2;
      if (hasCond(c, 'weakness')) atkSpd *= 0.5;
      c.attackTimer += dt;
      const interval = 1 / atkSpd;
      const tgt = c.target;
      if (tgt && tgt.alive && isEnemy(c, tgt)) {
        const d = dist(c, tgt);
        if (d <= c.attackRange + 20) {
          if (c.attackTimer >= interval) {
            c.attackTimer = 0;
            SK.w_auto.use(c, tgt, game);
          }
        } else {
          // Chase target continuously (player: WASD overrides in moveChar)
          c.moveTarget = { x: tgt.x, y: tgt.y };
          if (c.attackTimer >= interval) c.attackTimer = 0;
        }
      }
    }

    // AI
    if (!c.isPlayer) aiUpdate(c, dt, game);

    // Move
    moveChar(c, dt);
  }

  // AOE zones tick
  for (const z of game.aoeZones) {
    z.timer += dt;
    z.tickTimer += dt;
    if (z.tickTimer >= z.tickInterval) { z.tickTimer = 0; if (z.tick) z.tick(z, game); }
    if (z.timer >= z.duration) z.done = true;
  }
  game.aoeZones = game.aoeZones.filter(z => !z.done);

  // Zones de dégâts (lave, etc.)
  if (game.map && game.map.damage) {
    for (const c of game.chars) {
      if (!c.alive) continue;
      for (const dz of game.map.damage) {
        if (c.x > dz.x && c.x < dz.x + dz.w && c.y > dz.y && c.y < dz.y + dz.h) {
          c.hp -= (dz.dps || 10) * dt;
          if (c.hp <= 0) killChar(c, game, `☠ ${c.name} périt dans la lave !`);
        }
      }
    }
  }

  // Mise à jour caméra (suit le joueur)
  if (game.player && game.player.alive) {
    CAM.x = clamp(game.player.x - AW / 2, 0, WORLD_W - AW);
    CAM.y = clamp(game.player.y - AH / 2, 0, WORLD_H - AH);
  }

  // Projectiles
  for (const proj of game.projectiles) {
    if (proj.done) continue;
    const pdx = proj.tx - proj.x, pdy = proj.ty - proj.y;
    const pd = Math.hypot(pdx, pdy);
    if (pd < 10) { proj.done = true; proj.onArrive && proj.onArrive(); continue; }
    proj.x += (pdx / pd) * proj.speed * dt;
    proj.y += (pdy / pd) * proj.speed * dt;
  }
  game.projectiles = game.projectiles.filter(proj => !proj.done);

  // Effects
  for (const fx of game.effects) {
    fx.timer += dt;
    if (fx.timer >= fx.duration) fx.dead = true;
  }
  game.effects = game.effects.filter(fx => !fx.dead);

  // Floats de soin (delta HP positif depuis le snapshot)
  for (const c of game.chars) {
    if (c.alive && hpSnap[c.name] !== undefined && c.hp > hpSnap[c.name] + 1) {
      const healed = Math.floor(c.hp - hpSnap[c.name]);
      if (c.stats) c.stats.healsGiven += healed;
      addFloat(game, c.x, c.y - c.radius - 10, `+${healed}`, '#5efa8a', 12);
    }
  }

  // Update floatingTexts
  for (const ft of game.floatingTexts) {
    ft.timer += dt; ft.y += ft.vy * dt; ft.vy *= 0.88;
    ft.alpha = Math.max(0, 1 - ft.timer / ft.duration);
  }
  game.floatingTexts = game.floatingTexts.filter(ft => ft.timer < ft.duration);

  // Flag Stand update
  if (game.flagStand) updateFlagStand(dt);

  // Respawn des personnages morts
  for (const c of game.chars) {
    if (!c.alive && c.rezTimer > 0) {
      c.rezTimer -= dt;
      if (c.rezTimer <= 0) respawnChar(c, game);
    }
  }

  // Condition de victoire : 8 morts dans une équipe
  if ((game.deathCount[TEAM_ALLY]  || 0) >= 8) endGame(false);
  if ((game.deathCount[TEAM_ENEMY] || 0) >= 8) endGame(true);
}

const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');

// ── CLASS SYMBOLS ─────────────────────────────────────────────────
// ── FLAG STAND ────────────────────────────────────────────────────
function updateFlagStand(dt) {
  const fs = game.flagStand;
  const nearAllies  = game.chars.filter(c => c.alive && c.team === TEAM_ALLY  && dist(c,fs) < fs.radius);
  const nearEnemies = game.chars.filter(c => c.alive && c.team === TEAM_ENEMY && dist(c,fs) < fs.radius);
  const contested = nearAllies.length > 0 && nearEnemies.length > 0;

  if (!contested) {
    if (nearAllies.length > 0 && fs.team !== TEAM_ALLY) {
      fs.captureTeam = TEAM_ALLY;
      fs.progress = Math.min(1, fs.progress + dt / 5);
      if (fs.progress >= 1) {
        fs.team = TEAM_ALLY; fs.moraleTimer = 0;
        game.log('⚑ Équipe alliée capture le Flag Stand !', 'log-heal');
      }
    } else if (nearEnemies.length > 0 && fs.team !== TEAM_ENEMY) {
      fs.captureTeam = TEAM_ENEMY;
      fs.progress = Math.min(1, fs.progress + dt / 5);
      if (fs.progress >= 1) {
        fs.team = TEAM_ENEMY; fs.moraleTimer = 0;
        game.log('⚑ Équipe ennemie capture le Flag Stand !', 'log-dmg');
      }
    }
  }

  if (fs.team !== null) {
    fs.moraleTimer += dt;
    if (fs.moraleTimer >= 30) {
      fs.moraleTimer = 0;
      const m = Math.min(10, fs.morale[fs.team] + 1);
      fs.morale[fs.team] = m;
      const teamName = fs.team === TEAM_ALLY ? 'Alliée' : 'Ennemie';
      game.log(`📈 Moral Équipe ${teamName} : +${m}% dégâts !`, fs.team===TEAM_ALLY?'log-heal':'log-dmg');
    }
  }
}

function drawFlagStand() {
  const fs = game.flagStand;
  if (!fs) return;
  const tc = fs.team === TEAM_ALLY ? '#4af' : fs.team === TEAM_ENEMY ? '#f44' : '#fc0';
  ctx.save();
  // Zone de capture
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = tc;
  ctx.beginPath(); ctx.arc(fs.x, fs.y, fs.radius, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = tc; ctx.lineWidth = 2;
  ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.arc(fs.x, fs.y, fs.radius, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  // Arc de capture (progress)
  if (fs.captureTeam !== null && fs.progress > 0 && fs.progress < 1) {
    const pc = fs.captureTeam === TEAM_ALLY ? '#4af' : '#f44';
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = pc; ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(fs.x, fs.y, fs.radius * 0.65, -Math.PI/2, -Math.PI/2 + fs.progress * Math.PI*2);
    ctx.stroke();
  }
  // Drapeau central
  ctx.globalAlpha = 1;
  ctx.fillStyle = tc;
  ctx.shadowColor = tc; ctx.shadowBlur = 14;
  ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('⚑', fs.x, fs.y + 8);
  // Moral affiché
  if (fs.morale[TEAM_ALLY] > 0 || fs.morale[TEAM_ENEMY] > 0) {
    ctx.shadowBlur = 0; ctx.font = '10px sans-serif';
    if (fs.morale[TEAM_ALLY]  > 0) { ctx.fillStyle = '#4af'; ctx.fillText(`+${fs.morale[TEAM_ALLY]}%`,  fs.x - 48, fs.y - fs.radius - 6); }
    if (fs.morale[TEAM_ENEMY] > 0) { ctx.fillStyle = '#f44'; ctx.fillText(`+${fs.morale[TEAM_ENEMY]}%`, fs.x + 48, fs.y - fs.radius - 6); }
  }
  ctx.restore();
}

function drawMoraleHUD() {
  ctx.save();
  ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';

  // ── Compteur de morts ─────────────────────────────────────────
  const dA = game.deathCount[TEAM_ALLY]  || 0;
  const dE = game.deathCount[TEAM_ENEMY] || 0;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(4, 4, 160, 44);
  // Barres mort (8 max)
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i < dA ? '#f44' : '#333';
    ctx.fillRect(6 + i * 17, 7, 14, 7);
    ctx.fillStyle = i < dE ? '#f88' : '#333';
    ctx.fillRect(6 + i * 17, 16, 14, 7);
  }
  ctx.fillStyle = '#f44'; ctx.fillText(`Morts Alliés : ${dA}/8`, 6, 37);
  ctx.fillStyle = '#f88'; ctx.fillText(`Morts Ennemis: ${dE}/8`, 86, 37);

  const fs = game.flagStand;
  if (!fs) { ctx.restore(); return; }

  // ── Moral flag stand ──────────────────────────────────────────
  const mA = fs.morale[TEAM_ALLY], mE = fs.morale[TEAM_ENEMY];
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(4, 50, 160, 22);
  ctx.fillStyle = '#4af';
  ctx.fillRect(6, 52, mA * 7, 8);
  ctx.strokeStyle = '#4af'; ctx.lineWidth = 1;
  ctx.strokeRect(6, 52, 70, 8);
  ctx.fillStyle = '#4af'; ctx.fillText(`Moral Allié  +${mA}%`, 80, 61);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(4, 73, 160, 22);
  ctx.fillStyle = '#f44';
  ctx.fillRect(6, 75, mE * 7, 8);
  ctx.strokeStyle = '#f44';
  ctx.strokeRect(6, 75, 70, 8);
  ctx.fillStyle = '#f44'; ctx.fillText(`Moral Ennemi +${mE}%`, 80, 84);
  ctx.restore();
}

function drawClassSymbol(ctx, x, y, r, classKey) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.fillStyle   = 'rgba(255,255,255,0.9)';
  ctx.lineWidth   = 1.8;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  const s = r * 0.42;
  switch (classKey) {
    case 'warrior': {
      // Two diagonal crossing lines (crossed swords)
      ctx.beginPath(); ctx.moveTo(x-s, y-s); ctx.lineTo(x+s, y+s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+s, y-s); ctx.lineTo(x-s, y+s); ctx.stroke();
      // Guard crossbars
      const g = s*0.35;
      ctx.beginPath(); ctx.moveTo(x-g, y-g*0.8); ctx.lineTo(x+g, y-g*0.8); ctx.stroke();
      break;
    }
    case 'monk': {
      // Bold cross (+)
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x, y-s); ctx.lineTo(x, y+s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-s, y); ctx.lineTo(x+s, y); ctx.stroke();
      break;
    }
    case 'elementalist': {
      // Diamond with inner sparkle
      ctx.beginPath();
      ctx.moveTo(x, y-s); ctx.lineTo(x+s*0.65, y); ctx.lineTo(x, y+s); ctx.lineTo(x-s*0.65, y);
      ctx.closePath(); ctx.stroke();
      // Centre dot
      ctx.beginPath(); ctx.arc(x, y, s*0.18, 0, Math.PI*2); ctx.fill();
      break;
    }
    case 'mesmer': {
      // Flowing spiral
      ctx.beginPath();
      for (let i = 0; i <= 24; i++) {
        const t  = (i / 24) * Math.PI * 3;
        const rr = (i / 24) * s;
        const px = x + Math.cos(t) * rr;
        const py = y + Math.sin(t) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      break;
    }
    case 'ranger': {
      // Arrow pointing right →
      ctx.beginPath(); ctx.moveTo(x-s, y); ctx.lineTo(x+s*0.6, y); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x+s*0.6, y); ctx.lineTo(x+s*0.15, y-s*0.45);
      ctx.moveTo(x+s*0.6, y); ctx.lineTo(x+s*0.15, y+s*0.45);
      ctx.stroke();
      // Bow arc on left
      ctx.beginPath(); ctx.arc(x-s*0.7, y, s*0.55, -Math.PI*0.55, Math.PI*0.55); ctx.stroke();
      break;
    }
    case 'necro': {
      // Skull: circle head + two eye dots + jaw line
      const hr = s * 0.52;
      ctx.beginPath(); ctx.arc(x, y - s*0.1, hr, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x - s*0.22, y - s*0.15, s*0.11, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + s*0.22, y - s*0.15, s*0.11, 0, Math.PI*2); ctx.fill();
      // Teeth
      ctx.beginPath(); ctx.moveTo(x - s*0.35, y + s*0.35); ctx.lineTo(x + s*0.35, y + s*0.35); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - s*0.12, y + s*0.38); ctx.lineTo(x - s*0.12, y + s*0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + s*0.12, y + s*0.38); ctx.lineTo(x + s*0.12, y + s*0.6); ctx.stroke();
      break;
    }
    case 'assassin': {
      // X avec un trait vertical = lame d'assassin
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x,y-s*1.1); ctx.lineTo(x,y-s*0.3); ctx.stroke();
      break;
    }
    case 'ritualist': {
      // Trois cercles imbriqués (esprits)
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x,y,s*0.55,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x-s*0.5,y+s*0.3,s*0.25,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(x+s*0.5,y+s*0.3,s*0.25,0,Math.PI*2); ctx.stroke();
      break;
    }
    case 'dervish': {
      // Faucille : arc + trait
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x+s*0.1, y, s*0.7, Math.PI*0.85, Math.PI*1.85); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x-s*0.6,y+s*0.05); ctx.lineTo(x+s*0.8,y-s*0.5); ctx.stroke();
      break;
    }
    case 'paragon': {
      // Pointe de lance vers le haut
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y-s); ctx.lineTo(x+s*0.5, y+s*0.3); ctx.lineTo(x, y+s*0.0);
      ctx.lineTo(x-s*0.5, y+s*0.3); ctx.closePath(); ctx.stroke();
      // Trait de hampe
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+s); ctx.stroke();
      break;
    }
    default: {
      ctx.beginPath(); ctx.arc(x, y, s*0.3, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function generateBgCanvas(map) {
  if (map.bgCanvas) return;
  const oc = document.createElement('canvas');
  oc.width = WORLD_W; oc.height = WORLD_H;
  const ox = oc.getContext('2d');
  const rng = seededRng(map.seed || 1337);

  // Base fill
  ox.fillStyle = map.bg;
  ox.fillRect(0, 0, WORLD_W, WORLD_H);

  // Grass texture
  if (map.grass) {
    const gc = map.grassColors || ['rgba(0,30,0,0.2)','rgba(20,40,5,0.15)','rgba(0,0,0,0.1)'];
    for (let i = 0; i < 3600; i++) {
      const gx = rng() * WORLD_W, gy = rng() * WORLD_H;
      const len = 4 + rng() * 9, ang = rng() * Math.PI;
      ox.fillStyle = gc[Math.floor(rng() * gc.length)];
      ox.save(); ox.translate(gx, gy); ox.rotate(ang);
      ox.fillRect(-len/2, -1.5, len, 3);
      ox.restore();
    }
  }

  // Paths — cobblestone
  for (const p of (map.paths || [])) {
    ox.fillStyle = p.c;
    ox.fillRect(p.x, p.y, p.w, p.h);
    ox.strokeStyle = 'rgba(0,0,0,0.28)'; ox.lineWidth = 2;
    ox.strokeRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2);
    const ts = 32;
    ox.strokeStyle = 'rgba(0,0,0,0.13)'; ox.lineWidth = 1;
    for (let tx = p.x; tx <= p.x + p.w; tx += ts) {
      ox.beginPath(); ox.moveTo(tx, p.y); ox.lineTo(tx, p.y + p.h); ox.stroke();
    }
    for (let ty = p.y; ty <= p.y + p.h; ty += ts) {
      ox.beginPath(); ox.moveTo(p.x, ty); ox.lineTo(p.x + p.w, ty); ox.stroke();
    }
    // Random stone variation patches
    for (let i = 0; i < Math.floor(p.w * p.h / 2000); i++) {
      ox.fillStyle = `rgba(0,0,0,${0.03 + rng() * 0.07})`;
      ox.fillRect(p.x + rng() * p.w, p.y + rng() * p.h, 8 + rng() * 14, 6 + rng() * 10);
    }
  }

  // Walls — stone blocks with mortar
  for (const w of (map.walls || [])) {
    ox.fillStyle = map.wallColor || '#666';
    ox.fillRect(w.x, w.y, w.w, w.h);
    if (w.h >= 14 && w.w >= 14) {
      const bH = 14;
      ox.strokeStyle = 'rgba(0,0,0,0.22)'; ox.lineWidth = 1;
      for (let ly = w.y + bH; ly < w.y + w.h - 2; ly += bH) {
        ox.beginPath(); ox.moveTo(w.x + 3, ly); ox.lineTo(w.x + w.w - 3, ly); ox.stroke();
        const row = Math.round((ly - w.y) / bH);
        const bW = 26, off = (row % 2 === 0) ? 0 : bW / 2;
        for (let lx = w.x + off; lx < w.x + w.w - 2; lx += bW) {
          if (lx > w.x + 2) {
            ox.beginPath(); ox.moveTo(lx, ly - bH + 2); ox.lineTo(lx, ly - 2); ox.stroke();
          }
        }
      }
    }
    ox.fillStyle = 'rgba(255,255,255,0.15)';
    ox.fillRect(w.x, w.y, w.w, Math.min(4, w.h));
    ox.fillRect(w.x, w.y, Math.min(4, w.w), w.h);
    ox.fillStyle = 'rgba(0,0,0,0.4)';
    ox.fillRect(w.x, w.y + w.h - Math.min(4, w.h), w.w, Math.min(4, w.h));
    ox.fillRect(w.x + w.w - Math.min(4, w.w), w.y, Math.min(4, w.w), w.h);
  }

  // Trees
  for (const t of (map.trees || [])) {
    const r = t.r || 22;
    ox.fillStyle = 'rgba(0,0,0,0.22)';
    ox.beginPath(); ox.ellipse(t.x + 5, t.y + r * 0.65, r * 0.9, r * 0.38, 0, 0, Math.PI*2); ox.fill();
    ox.fillStyle = '#5c3c1a';
    ox.beginPath(); ox.ellipse(t.x, t.y + r * 0.55, r * 0.18, r * 0.4, 0, 0, Math.PI*2); ox.fill();
    ox.fillStyle = t.darkColor || '#154a08';
    ox.beginPath(); ox.arc(t.x, t.y, r, 0, Math.PI*2); ox.fill();
    ox.fillStyle = t.color || '#236e12';
    ox.beginPath(); ox.arc(t.x - r * 0.12, t.y - r * 0.1, r * 0.78, 0, Math.PI*2); ox.fill();
    ox.fillStyle = 'rgba(80,210,40,0.26)';
    ox.beginPath(); ox.arc(t.x - r * 0.3, t.y - r * 0.28, r * 0.38, 0, Math.PI*2); ox.fill();
    ox.fillStyle = 'rgba(200,255,100,0.45)';
    ox.beginPath(); ox.arc(t.x - r * 0.36, t.y - r * 0.38, r * 0.1, 0, Math.PI*2); ox.fill();
  }

  // Bushes
  for (const b of (map.bushes || [])) {
    const r = b.r || 12;
    ox.fillStyle = 'rgba(0,0,0,0.18)';
    ox.beginPath(); ox.ellipse(b.x + 3, b.y + r * 0.6, r * 0.8, r * 0.32, 0, 0, Math.PI*2); ox.fill();
    ox.fillStyle = b.color || '#1d5210';
    ox.beginPath(); ox.arc(b.x, b.y, r, 0, Math.PI*2); ox.fill();
    ox.beginPath(); ox.arc(b.x + r * 0.6, b.y - r * 0.2, r * 0.7, 0, Math.PI*2); ox.fill();
    ox.beginPath(); ox.arc(b.x - r * 0.5, b.y - r * 0.1, r * 0.65, 0, Math.PI*2); ox.fill();
    ox.fillStyle = 'rgba(60,160,30,0.32)';
    ox.beginPath(); ox.arc(b.x - r * 0.2, b.y - r * 0.3, r * 0.44, 0, Math.PI*2); ox.fill();
  }

  // Decorative elements
  for (const d of (map.decor || [])) {
    if (d.type === 'stone') {
      ox.fillStyle = '#7e7260';
      ox.beginPath(); ox.ellipse(d.x, d.y, d.r || 6, (d.r || 6) * 0.6, d.ang || 0, 0, Math.PI*2); ox.fill();
      ox.fillStyle = 'rgba(255,255,255,0.18)';
      ox.beginPath(); ox.ellipse(d.x - (d.r||6)*0.22, d.y - (d.r||6)*0.22, (d.r||6)*0.38, (d.r||6)*0.28, d.ang||0, 0, Math.PI*2); ox.fill();
    } else if (d.type === 'flower') {
      const fc = d.color || '#ffdd44';
      for (let fi = 0; fi < 5; fi++) {
        const fa = fi * Math.PI * 2 / 5;
        ox.fillStyle = fc;
        ox.beginPath(); ox.arc(d.x + Math.cos(fa) * 4, d.y + Math.sin(fa) * 4, 2.5, 0, Math.PI*2); ox.fill();
      }
      ox.fillStyle = '#fffacc';
      ox.beginPath(); ox.arc(d.x, d.y, 2.2, 0, Math.PI*2); ox.fill();
    }
  }

  // Spawn circle markers
  for (const sp of (map.allySpawns || [])) {
    ox.strokeStyle = 'rgba(80,160,255,0.28)'; ox.lineWidth = 1.5;
    ox.setLineDash([5, 7]);
    ox.beginPath(); ox.arc(sp.x, sp.y, 26, 0, Math.PI*2); ox.stroke();
    ox.setLineDash([]);
  }
  for (const sp of (map.enemySpawns || [])) {
    ox.strokeStyle = 'rgba(255,80,80,0.28)'; ox.lineWidth = 1.5;
    ox.setLineDash([5, 7]);
    ox.beginPath(); ox.arc(sp.x, sp.y, 26, 0, Math.PI*2); ox.stroke();
    ox.setLineDash([]);
  }

  map.bgCanvas = oc;
}

function render() {
  // Reset complet de la matrice — évite l'accumulation si un frame précédent a planté
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, AW, AH);

  // ── Caméra ───────────────────────────────────────────────────────
  ctx.save();
  ctx.translate(-CAM.x, -CAM.y);

  // ── Fond monde (prérendu) ─────────────────────────────────────────
  const map = game.map;
  if (map) {
    generateBgCanvas(map);
    ctx.drawImage(map.bgCanvas, 0, 0);
  } else {
    ctx.fillStyle = '#0b0908';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  }

  // ── Zones de dégâts (lave, eau acide…) ────────────────────────────
  if (map) {
    const pulse = 0.25 + Math.sin(Date.now() / 450) * 0.08;
    for (const dz of (map.damage || [])) {
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = dz.color || '#f40';
      ctx.fillRect(dz.x, dz.y, dz.w, dz.h);
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = dz.color || '#f40';
      ctx.lineWidth = 2;
      ctx.strokeRect(dz.x, dz.y, dz.w, dz.h);
      ctx.restore();
    }
  }

  // ── Flag Stand ────────────────────────────────────────────────────
  drawFlagStand();

  // ── AOE zones
  for (const z of game.aoeZones) {
    const t = z.timer / z.duration;
    ctx.save();
    ctx.globalAlpha = (z.alpha || 0.25) * (1 - t * 0.3);
    ctx.fillStyle = z.color;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = z.color; ctx.lineWidth = 2; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Effects
  for (const fx of game.effects) {
    const t = fx.timer / fx.duration;
    ctx.save();
    ctx.globalAlpha = (1 - t) * 0.7;
    ctx.strokeStyle = fx.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(fx.x, fx.y, fx.radius * (0.3 + t * 0.7), 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Projectiles
  for (const proj of game.projectiles) {
    ctx.save();
    ctx.fillStyle = proj.color;
    ctx.shadowColor = proj.color; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(proj.x, proj.y, 5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Characters
  for (const c of game.chars) {
    if (!c.alive) {
      // Corps + timer de résurrection
      ctx.save(); ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      if (c.rezTimer > 0) {
        ctx.save();
        ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = c.team === TEAM_ALLY ? '#6df' : '#f86';
        ctx.globalAlpha = 0.9;
        ctx.fillText(`${Math.ceil(c.rezTimer)}s`, c.x, c.y - c.radius - 3);
        ctx.restore();
      }
      continue;
    }

    const isSelected = game.player && game.player.target === c;
    const isPlayer   = c.isPlayer;

    // Selection ring
    if (isSelected) {
      ctx.save();
      ctx.strokeStyle = isEnemy(game.player, c) ? '#f00' : '#0f0';
      ctx.lineWidth = 2;
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.arc(c.x, c.y, c.radius + 6, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    // Enchantment glow
    if (Object.keys(c.enchantments).length > 0) {
      ctx.save();
      ctx.shadowColor = '#0ff'; ctx.shadowBlur = 14; ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#0ff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.radius + 3, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    // Hex tint
    if (Object.keys(c.hexes).length > 0) {
      ctx.save();
      ctx.shadowColor = '#a0f'; ctx.shadowBlur = 10; ctx.globalAlpha = 0.4;
      ctx.strokeStyle = '#a0f'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.radius + 2, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    // Body — team base color (blue = ally, red = enemy)
    const teamFill   = c.team === TEAM_ALLY ? '#18346a' : '#6a1c1c';
    const teamRing   = c.team === TEAM_ALLY ? '#5bcfff' : '#ff5555';
    const playerRing = '#ffe066';
    ctx.save();
    if (isPlayer) { ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 22; }
    else { ctx.shadowColor = c.color; ctx.shadowBlur = 6; }
    ctx.fillStyle = teamFill;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2); ctx.fill();
    // Class-color tinted inner disc (more opaque for vivid class identity)
    ctx.globalAlpha = 0.72;
    ctx.fillStyle = c.color;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.radius - 3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    // Outer ring (team color, gold for player)
    ctx.strokeStyle = isPlayer ? playerRing : teamRing;
    ctx.lineWidth   = isPlayer ? 3 : 2.5;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    // Class symbol (white icon drawn on top)
    drawClassSymbol(ctx, c.x, c.y, c.radius, c.classKey);

    // Bar layout (used by cast bar, HP bar, energy bar)
    const barW = c.radius * 2 + 4, barH = 5;
    const bx = c.x - barW/2, by = c.y - c.radius - 14;

    // Knockdown indicator — flat ellipse beneath the character
    if (hasCond(c, 'knockdown')) {
      ctx.save();
      ctx.translate(c.x, c.y + c.radius * 0.2);
      ctx.scale(1.7, 0.38);
      ctx.beginPath();
      ctx.arc(0, 0, c.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 200, 0, 0.40)';
      ctx.fill();
      ctx.strokeStyle = '#fc0';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    }

    // Cast bar (horizontal, above HP/energy bars)
    if (c.casting) {
      const prog = clamp(c.castTimer / c.casting.sk.cast, 0, 1);
      const cbW = barW, cbH = 5;
      const cbX = bx, cbY = by - 10;
      ctx.save();
      ctx.fillStyle = '#1a1505';
      ctx.fillRect(cbX, cbY, cbW, cbH);
      ctx.fillStyle = `rgba(255,165,0,${0.55 + 0.45 * prog})`;
      ctx.fillRect(cbX, cbY, cbW * prog, cbH);
      ctx.strokeStyle = '#8a6400';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(cbX, cbY, cbW, cbH);
      const skLabel = (c.casting.sk.name || '').slice(0, 12);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 5px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(skLabel, c.x, cbY + cbH / 2);
      ctx.textBaseline = 'alphabetic';
      ctx.restore();
    }

    // HP bar (above)
    const hpPct = clamp(c.hp / c.maxHp, 0, 1);
    ctx.fillStyle = '#0e0a04'; ctx.fillRect(bx, by, barW, barH);
    ctx.fillStyle = hpPct > 0.5 ? '#3a9820' : hpPct > 0.25 ? '#b0921a' : '#b02020';
    ctx.fillRect(bx, by, barW * hpPct, barH);

    // Energy bar
    const enPct = clamp(c.energy / c.maxEnergy, 0, 1);
    ctx.fillStyle = '#0e0a04'; ctx.fillRect(bx, by + 6, barW, 3);
    ctx.fillStyle = '#2858b0'; ctx.fillRect(bx, by + 6, barW * enPct, 3);

    // Name — blue for allies, red for enemies, gold for player
    ctx.fillStyle = isPlayer ? '#ffe066' : (c.team === TEAM_ALLY ? '#7bcfff' : '#ff7777');
    ctx.font = `${isPlayer ? 'bold ' : ''}10px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(c.name, c.x, c.y - c.radius - 17);

    // Condition dots
    const conds = Object.keys(c.conditions);
    for (let i = 0; i < conds.length; i++) {
      const def = COND[conds[i]];
      if (!def) continue;
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(c.x - (conds.length-1)*5 + i*10, c.y + c.radius + 6, 4, 0, Math.PI*2); ctx.fill();
    }
  }

  // ── Floating texts ────────────────────────────────────────────────
  for (const ft of game.floatingTexts) {
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.fillStyle = ft.color;
    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 4;
    ctx.font = `bold ${ft.size}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }

  ctx.restore(); // fin caméra

  // ── HUD Moral ─────────────────────────────────────────────────────
  drawMoraleHUD();

  // ── Minimap ───────────────────────────────────────────────────────
  const MM_W = 140, MM_H = 80, MM_X = AW - MM_W - 6, MM_Y = 6;
  const scx = MM_W / WORLD_W, scy = MM_H / WORLD_H;
  ctx.save();
  ctx.globalAlpha = 0.88;
  ctx.fillStyle = game.map ? game.map.bg : '#111';
  ctx.fillRect(MM_X, MM_Y, MM_W, MM_H);
  ctx.strokeStyle = '#6a4818'; ctx.lineWidth = 1;
  ctx.strokeRect(MM_X, MM_Y, MM_W, MM_H);
  if (game.map) {
    // Sols
    for (const p of (game.map.paths || [])) {
      ctx.fillStyle = p.c || '#2a3040';
      ctx.fillRect(MM_X + p.x*scx, MM_Y + p.y*scy, p.w*scx, p.h*scy);
    }
    // Lave
    for (const dz of (game.map.damage || [])) {
      ctx.fillStyle = dz.color || '#f40';
      ctx.globalAlpha = 0.5;
      ctx.fillRect(MM_X + dz.x*scx, MM_Y + dz.y*scy, dz.w*scx, dz.h*scy);
      ctx.globalAlpha = 0.82;
    }
    // Murs
    ctx.fillStyle = game.map.wallColor || '#666';
    for (const w of (game.map.walls || [])) {
      ctx.fillRect(MM_X + w.x*scx, MM_Y + w.y*scy, Math.max(1,w.w*scx), Math.max(1,w.h*scy));
    }
  }
  // Personnages
  for (const c of game.chars) {
    if (!c.alive) continue;
    ctx.fillStyle = c.isPlayer ? '#ffe066' : (c.team === TEAM_ALLY ? '#4af' : '#f44');
    const r = c.isPlayer ? 3 : 2;
    ctx.beginPath();
    ctx.arc(MM_X + c.x*scx, MM_Y + c.y*scy, r, 0, Math.PI*2);
    ctx.fill();
  }
  // Viewport rectangle
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  ctx.strokeRect(MM_X + CAM.x*scx, MM_Y + CAM.y*scy, AW*scx, AH*scy);
  // Nom de la map
  if (game.map) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(game.map.name, MM_X + 2, MM_Y + MM_H - 3);
  }
  ctx.restore();
}

// ── UI UPDATE ─────────────────────────────────────────────────────
function updateUI() {
  const p = game.player;
  if (!p) return;

  // Player bars
  const hpPct = clamp(p.hp / p.maxHp * 100, 0, 100);
  document.getElementById('hp-fill').style.width = hpPct + '%';
  document.getElementById('hp-val').textContent = `${Math.ceil(p.hp)} / ${p.maxHp}`;
  const enPct = clamp(p.energy / p.maxEnergy * 100, 0, 100);
  document.getElementById('energy-fill').style.width = enPct + '%';
  document.getElementById('energy-val').textContent = `${Math.floor(p.energy)} / ${p.maxEnergy}`;

  // Cast bar
  const cg = document.getElementById('cast-group');
  if (p.casting) {
    cg.style.display = 'flex';
    const pct = clamp(p.castTimer / p.casting.sk.cast * 100, 0, 100);
    document.getElementById('cast-fill').style.width = pct + '%';
    document.getElementById('cast-val').textContent = p.casting.sk.name;
  } else { cg.style.display = 'none'; }

  // Player conditions
  const pcEl = document.getElementById('player-conds');
  pcEl.innerHTML = '';
  for (const [name, data] of Object.entries({...p.conditions, ...p.hexes, ...p.enchantments})) {
    const def = COND[name] || HEX[name] || ENCH[name];
    if (!def) continue;
    const badge = document.createElement('span');
    badge.className = 'cond-badge';
    badge.style.background = def.color + '99';
    badge.style.border = `1px solid ${def.color}`;
    badge.textContent = def.label + (data.duration < 9000 ? ` ${Math.ceil(data.duration)}s` : '');
    pcEl.appendChild(badge);
  }

  // Target box
  const tgt = p.target;
  if (tgt && tgt.alive) {
    document.getElementById('target-name').textContent = tgt.name;
    document.getElementById('target-hp-fill').style.width = clamp(tgt.hp / tgt.maxHp * 100, 0, 100) + '%';
    const tcEl = document.getElementById('target-conds');
    tcEl.innerHTML = '';
    for (const [name] of Object.entries({...tgt.conditions, ...tgt.hexes, ...tgt.enchantments})) {
      const def = COND[name] || HEX[name] || ENCH[name];
      if (!def) continue;
      const dot = document.createElement('div');
      dot.title = def.label;
      dot.style.cssText = `width:10px;height:10px;border-radius:50%;background:${def.color};`;
      tcEl.appendChild(dot);
    }
  } else {
    document.getElementById('target-name').textContent = '— Aucune cible —';
    document.getElementById('target-hp-fill').style.width = '0%';
    document.getElementById('target-conds').innerHTML = '';
  }

  // Party list
  const pl = document.getElementById('party-list');
  pl.innerHTML = '';
  for (const c of game.chars.filter(x => x.team === TEAM_ALLY)) {
    const row = document.createElement('div'); row.className = 'party-row';
    const hpP = clamp(c.hp / c.maxHp * 100, 0, 100);
    const enP = clamp(c.energy / c.maxEnergy * 100, 0, 100);
    const condDots = Object.keys(c.conditions).map(n => {
      const def = COND[n]; return def ? `<div class="mini-cond" title="${def.label}" style="background:${def.color}"></div>` : '';
    }).join('');
    row.innerHTML = `<div class="party-name" style="color:${c.alive ? '#bbb' : '#555'}">${c.alive ? '' : '☠ '}${c.name}</div>
      <div class="bar-row">
        <div class="mini-bar"><div class="mini-bar-fill" style="width:${hpP}%;background:${hpP>50?'#4a4':hpP>25?'#aa4':'#a44'}"></div></div>
        <div class="mini-bar"><div class="mini-bar-fill" style="width:${enP}%;background:#44b"></div></div>
      </div>
      <div class="mini-conds">${condDots}</div>`;
    pl.appendChild(row);
  }

  // Skill bar
  const sb = document.getElementById('skillbar');
  for (let i = 0; i < 8; i++) {
    const el = sb.children[i];
    if (!el) continue;
    const skId = p.skills[i];
    const sk = SK[skId];
    if (!sk) continue;
    const cd = p.skillCooldowns[i];
    const noE = p.energy < sk.cost;
    const used = sk.oneUse && p.usedOneUse[i];
    el.classList.toggle('on-cd', cd > 0 || used);
    el.classList.toggle('no-energy', noE && cd <= 0);
    const overlay = el.querySelector('.skill-cd-overlay');
    if (overlay) {
      if (used) overlay.textContent = '—';
      else if (cd > 0) overlay.textContent = cd.toFixed(1);
      else overlay.textContent = '';
    }
    // Toggle active states
    if (skId === 'w_auto') el.classList.toggle('skill-toggle-active', p.autoAttack);
    if (skId === 'w_frenzy') el.classList.toggle('skill-toggle-active', hasEnch(p, 'frenzy'));
  }
}

// ── INIT SKILL BAR ───────────────────────────────────────────────
function buildSkillBar(p) {
  const sb = document.getElementById('skillbar');
  sb.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const skId = p.skills[i];
    const sk = SK[skId] || { name:'?', icon:'?', cost:0 };
    const slot = document.createElement('div');
    slot.className = 'skill-slot';
    slot.title = sk.desc || sk.name;
    slot.innerHTML = `
      <span class="skill-key-txt">${i+1}</span>
      <div class="skill-icon">${sk.icon || '?'}</div>
      <div class="skill-name-txt">${sk.name}</div>
      ${sk.cost > 0 ? `<span class="skill-cost-txt">${sk.cost}e</span>` : ''}
      <div class="skill-cd-overlay"></div>`;
    slot.addEventListener('click', () => useSkill(p, i));
    // Tooltip
    slot.addEventListener('mouseenter', ev => {
      const s = SK[skId]; if (!s) return;
      const tt = document.getElementById('skill-tooltip');
      document.getElementById('tt-name').textContent = s.name + (s.elite ? '  ★' : '');
      const tags = [];
      if (s.elite)    tags.push('ÉLITE');
      if (s.isHeal)   tags.push('SOIN');
      if (s.isHex)    tags.push('MALÉFICE');
      if (s.isEnchant||s.isEnch) tags.push('ENCHANT');
      if (s.isAttack) tags.push('ATTAQUE');
      if (s.isSpell)  tags.push('SORT');
      if (s.isToggle) tags.push('TOGGLE');
      document.getElementById('tt-tags').textContent = tags.join(' · ');
      document.getElementById('tt-desc').textContent = s.desc || '—';
      const rng = !s.range ? 'Contact' : s.range <= 160 ? 'Corps-à-corps' : s.range <= 350 ? 'Moyenne' : 'Longue';
      document.getElementById('tt-stats').innerHTML =
        `<div class="tt-stat"><div class="tt-stat-val">${s.cost}</div><div class="tt-stat-lbl">Énergie</div></div>` +
        (s.cast > 0 ? `<div class="tt-stat"><div class="tt-stat-val">${s.cast}s</div><div class="tt-stat-lbl">Incantation</div></div>` : '') +
        (s.recharge > 0 ? `<div class="tt-stat"><div class="tt-stat-val">${s.recharge}s</div><div class="tt-stat-lbl">Rechargement</div></div>` : '') +
        `<div class="tt-stat"><div class="tt-stat-val">${rng}</div><div class="tt-stat-lbl">Portée</div></div>`;
      const r = ev.currentTarget.getBoundingClientRect();
      tt.style.left = Math.max(4, r.left - 10) + 'px';
      tt.style.bottom = (window.innerHeight - r.top + 6) + 'px';
      tt.style.display = 'block';
    });
    slot.addEventListener('mouseleave', () => {
      document.getElementById('skill-tooltip').style.display = 'none';
    });
    sb.appendChild(slot);
  }
}

// ── GAME START / END ──────────────────────────────────────────────
function shuffle(arr) { for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function startGame() {
  const cls = document.getElementById('class-picker').value;
  const build = BUILDS[cls];
  if (!build) return;

  // Reset state
  document.getElementById('log-entries').innerHTML = '';
  game.chars = []; game.effects = []; game.projectiles = []; game.aoeZones = [];
  game.floatingTexts = [];
  game.over = false; game.running = false; game.logLines = [];
  game.flagStand = null;
  game.deathCount = { 0: 0, 1: 0 };

  // --- Map aléatoire ---
  game.map = MAPS[Math.floor(Math.random() * MAPS.length)];
  generateBgCanvas(game.map);
  const aSpawns = game.map.allySpawns;
  const eSpawns = game.map.enemySpawns;

  // --- Spawn characters ---
  const player = makeChar(build, TEAM_ALLY, aSpawns[0].x, aSpawns[0].y, true);
  player.name = 'Vous'; game.player = player; game.chars.push(player);

  // 3 alliés aléatoires (dont au moins 1 soin)
  const healerPool = shuffle(ALLY_POOL.filter(b => b.healBonus)).slice(0,1);
  const otherPool  = shuffle(ALLY_POOL.filter(b => !b.healBonus)).slice(0,2);
  const allyBuilds = [...healerPool, ...otherPool];
  const allies = allyBuilds.map((b,i) => makeChar(b, TEAM_ALLY, aSpawns[i+1].x, aSpawns[i+1].y));
  allies.forEach(a => game.chars.push(a));

  // 4 ennemis aléatoires (dont 1 healer garanti)
  const eHealers = shuffle(ENEMY_POOL.filter(b => b.healBonus||b.classKey==='monk'||b.classKey==='ritualist'));
  const eDmg     = shuffle(ENEMY_POOL.filter(b => !b.healBonus&&b.classKey!=='monk'&&b.classKey!=='ritualist'));
  const enemyBuilds = [eHealers[0], eDmg[0], eDmg[1]||eDmg[0], eDmg[2]||eDmg[1]];
  const enemies = enemyBuilds.map((b,i) => makeChar(b, TEAM_ENEMY, eSpawns[i].x, eSpawns[i].y));
  enemies.forEach(e => game.chars.push(e));

  // Position caméra initiale
  CAM.x = clamp(aSpawns[0].x - AW/2, 0, WORLD_W - AW);
  CAM.y = clamp(aSpawns[0].y - AH/2, 0, WORLD_H - AH);

  // Flag Stand
  if (game.map.flagStand) {
    game.flagStand = {
      x: game.map.flagStand.x, y: game.map.flagStand.y,
      team: null, progress: 0, captureTeam: null,
      morale: [0, 0], moraleTimer: 0, radius: 90,
    };
  }

  // Default AI targets
  const firstEnemy = enemies.find(e=>e.classKey!=='monk'&&e.classKey!=='ritualist') || enemies[0];
  player.target = firstEnemy;
  allies.forEach(a => { a.target = a.healBonus ? player : firstEnemy; });
  enemies.forEach(e => { e.target = e.healBonus ? allies[0]||player : player; });

  // Désignation des flaggers (un par équipe, non-healer de préférence)
  if (game.flagStand) {
    const aFlagger = allies.find(a => !a.healBonus) || allies[0];
    if (aFlagger) aFlagger.isFlagger = true;
    const eFlagger = enemies.find(e => !e.healBonus && e.classKey!=='monk' && e.classKey!=='ritualist') || enemies[0];
    if (eFlagger) eFlagger.isFlagger = true;
  }

  buildSkillBar(player);

  // --- Countdown 3-2-1 ---
  const ov = document.getElementById('overlay');
  const msg = document.getElementById('overlay-msg');
  const sub = document.getElementById('overlay-sub');
  ov.style.display = 'flex';
  document.getElementById('restart-btn').style.display = 'none';
  msg.style.color = '#fc0'; msg.style.fontSize = '64px';

  const enemyNames = enemies.map(e=>e.name).join(', ');
  sub.textContent = `Adversaires : ${enemyNames}`;

  let count = 3;
  msg.textContent = count;
  const cd = setInterval(() => {
    count--;
    if (count > 0) {
      msg.textContent = count;
    } else {
      clearInterval(cd);
      msg.textContent = 'COMBAT!';
      msg.style.color = '#f44';
      setTimeout(() => {
        ov.style.display = 'none';
        document.getElementById('restart-btn').style.display = '';
        msg.style.fontSize = '';
        game.running = true;
        game.log('=== Combat commencé ! ===','log-sys');
        game.log('ZQSD: déplacer | 1-8: compétences | Espace: auto-attaque','log-sys');
      }, 700);
    }
  }, 1000);
}

function endGame(won) {
  if (game.over) return;
  game.over = true; game.running = false;
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  document.getElementById('overlay-msg').style.color = won ? '#8f8' : '#f88';
  document.getElementById('overlay-msg').textContent = won ? '⚔ VICTOIRE !' : '☠ DÉFAITE';
  const dA = game.deathCount[TEAM_ALLY]||0, dE = game.deathCount[TEAM_ENEMY]||0;
  document.getElementById('overlay-sub').textContent = won
    ? `Ennemis : ${dE} morts — Alliés : ${dA} morts`
    : `Alliés : ${dA} morts — Ennemis : ${dE} morts`;

  // Per-character stats table
  const statsDiv = document.getElementById('overlay-stats');
  if (statsDiv) {
    const allies  = game.chars.filter(c => c.team === TEAM_ALLY);
    const enemies = game.chars.filter(c => c.team === TEAM_ENEMY);
    function buildTable(chars, title, rowClass) {
      let html = `<div class="stats-group"><div class="stats-title">${title}</div>`;
      html += '<table class="stats-table"><thead><tr>';
      html += '<th>Personnage</th><th>Dmg</th><th>Reçu</th><th>Soins</th><th>Kills</th><th>Morts</th>';
      html += '</tr></thead><tbody>';
      for (const c of chars) {
        const s = c.stats || {};
        html += `<tr class="${rowClass}">
          <td>${c.name}</td>
          <td>${Math.round(s.dmgDealt   || 0)}</td>
          <td>${Math.round(s.dmgReceived|| 0)}</td>
          <td>${Math.round(s.healsGiven || 0)}</td>
          <td>${s.kills  || 0}</td>
          <td>${s.deaths || 0}</td>
        </tr>`;
      }
      html += '</tbody></table></div>';
      return html;
    }
    statsDiv.innerHTML = buildTable(allies, 'Alliés', 'ally-row') + buildTable(enemies, 'Ennemis', 'enemy-row');
  }

  game.log(won ? '=== VICTOIRE ===' : '=== DÉFAITE ===', won ? 'log-heal' : 'log-dmg');
}

// ── LOOP ─────────────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  render();
  updateUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });
</script>
</body>
